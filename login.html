<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ATHENAFINANCE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a202c; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background-color: #ffffff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); padding: 40px; width: 100%; max-width: 400px; }
        .btn-premium { background-color: #0dcaf0; color: #1a202c; font-weight: bold; border: none; }
        .btn-premium:hover { background-color: #0baccc; color: white; }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <h3 class="fw-bold mb-1">💎 ATHENAFINANCE</h3>
        <p class="text-muted mb-4 small">Curadoria Premium</p>
        
        <!-- O formulário envia os dados para o nosso motor verificar -->
        <form action="/login" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label text-secondary small fw-bold">Usuário</label>
                <input type="text" name="usuario" class="form-control" required placeholder="Digite seu usuário">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-secondary small fw-bold">Senha</label>
                <input type="password" name="senha" class="form-control" required placeholder="Digite sua senha">
            </div>
            <button type="submit" class="btn btn-premium w-100 py-2">Acessar Plataforma</button>
        </form>
    </div>

</body>
</html>
